name: qa
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: puppeteer
        run: |
          npm install puppeteer --no-save
          npx puppeteer browsers install chrome
      - name: static server
        run: python3 -m http.server 8099 &
      - name: скриншоты и автопроверки
        run: node qa/shots.js
      - name: артефакт со скриншотами
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: qa/shots/
          retention-days: 14
